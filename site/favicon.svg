<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="geometricPrecision">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="55%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#134E4A"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="28%" r="65%">
      <stop offset="0%" stop-color="#5EEAD4" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#5EEAD4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Tile -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect width="64" height="64" rx="14" fill="url(#glow)"/>

  <!-- Bidirectional translate glyph: two stacked arrows -->
  <g stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Top arrow: left to right -->
    <path d="M14 24 L46 24"/>
    <path d="M40 18 L46 24 L40 30"/>
    <!-- Bottom arrow: right to left -->
    <path d="M50 40 L18 40"/>
    <path d="M24 34 L18 40 L24 46"/>
  </g>

  <!-- Subtle accent dot in upper-right corner -->
  <circle cx="50" cy="14" r="3" fill="#5EEAD4" opacity="0.85"/>
</svg>
